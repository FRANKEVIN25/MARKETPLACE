# Se combina con docker-compose.yml. COMPOSE_PROJECT_NAME aísla los volúmenes.
services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-ecomparts-lab}-postgres
  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-ecomparts-lab}-redis
  odoo:
    container_name: ${COMPOSE_PROJECT_NAME:-ecomparts-lab}-odoo
    ports: !override
      - "127.0.0.1:${ODOO_PORT:-8070}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT:-8072}:8072"
  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-ecomparts-lab}-backend
    ports: !override
      - "127.0.0.1:${DJANGO_PORT:-8001}:8000"
  celery_worker:
    container_name: ${COMPOSE_PROJECT_NAME:-ecomparts-lab}-celery-worker
  celery_beat:
    container_name: ${COMPOSE_PROJECT_NAME:-ecomparts-lab}-celery-beat
  flower:
    container_name: ${COMPOSE_PROJECT_NAME:-ecomparts-lab}-flower
    ports: !override
      - "127.0.0.1:${FLOWER_PORT:-5556}:5555"
