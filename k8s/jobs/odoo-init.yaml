apiVersion: batch/v1
kind: Job
metadata:
  name: odoo-init
  namespace: ecomparts
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo-init
        app.kubernetes.io/part-of: ecomparts
    spec:
      restartPolicy: Never
      containers:
        - name: odoo-init
          image: ecomparts-odoo:block2
          imagePullPolicy: Never
          args: [bootstrap]
          envFrom:
            - configMapRef:
                name: odoo-config
            - secretRef:
                name: ecomparts-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
            - name: config
              mountPath: /etc/odoo/odoo.conf.tpl
              subPath: odoo.conf.tpl
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odoo-data
        - name: config
          configMap:
            name: odoo-config
