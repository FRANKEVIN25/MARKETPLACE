services:
  # ============================================
  # PostgreSQL - Base de Datos
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: ecomparts-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
      - ./services/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - ecomparts-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # ⭐ NUEVO: Límites de recursos para PostgreSQL

  # ============================================
  # Redis - Cache y Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ecomparts-redis
    # en producion ponerlo en yes
    command: redis-server --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - ecomparts-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # ⭐ NUEVO: Límites de recursos para Redis

  # ============================================
<<<<<<< HEAD
