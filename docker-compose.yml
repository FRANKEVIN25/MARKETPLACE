    build:
      context: ./services/odoo
      dockerfile: Dockerfile
    container_name: ecomparts-odoo-shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8070}:8069"
